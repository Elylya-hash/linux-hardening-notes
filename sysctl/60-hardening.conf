# /etc/sysctl.d/60-hardening.conf
# Применить: sysctl --system
# Проверить одно значение: sysctl net.ipv4.tcp_syncookies

### Сеть ###

# Проверка обратного пути: пакет отбрасывается, если ответ на его адрес
# источника ушёл бы через другой интерфейс (защита от подмены адреса).
# На маршрутизаторах с асимметричной маршрутизацией ставят 2 (loose).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Сервер не маршрутизатор: ICMP redirect не принимаем и не отправляем
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Пакеты с маршрутом, заданным отправителем, не принимаем
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Не отвечаем на широковещательный ping (smurf-атаки)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# SYN cookies: сервер продолжает принимать соединения при SYN-флуде
net.ipv4.tcp_syncookies = 1

# Журналировать пакеты с невозможными адресами источника
net.ipv4.conf.all.log_martians = 1

### Ядро ###

# Скрыть адреса ядра в /proc от всех, включая root без CAP_SYSLOG
kernel.kptr_restrict = 2

# dmesg только для root
kernel.dmesg_restrict = 1

# ptrace только для дочерних процессов (мешает краже данных из чужих процессов)
kernel.yama.ptrace_scope = 1

# Полная рандомизация адресного пространства
kernel.randomize_va_space = 2

# Запретить непривилегированным пользователям загружать eBPF-программы
kernel.unprivileged_bpf_disabled = 1

### Файловая система ###

# Защита от атак через жёсткие и символические ссылки в общих каталогах (/tmp)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Не создавать дампы памяти для setuid-программ
fs.suid_dumpable = 0
